    <circle cx="10" cy="10" r="11" fill="none" stroke="#9E4359" stroke-width="1" opacity="0.5"/>
    <circle cx="40" cy="25" r="13" fill="url(#roseB)"/>
    <circle cx="60" cy="5" r="8" fill="#F6DEE2"/>
