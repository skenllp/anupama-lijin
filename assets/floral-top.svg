    <path d="M20,45 C-5,30 0,0 25,5 C20,15 28,25 42,22 C35,38 30,40 20,45 Z" fill="url(#leafA)" opacity="0.7"/>
    <circle cx="10" cy="10" r="18" fill="url(#roseB)"/>
    <circle cx="38" cy="24" r="13" fill="url(#roseA)"/>
    <circle cx="10" cy="10" r="9" fill="none" stroke="#9E4359" stroke-width="1" opacity="0.4"/>
